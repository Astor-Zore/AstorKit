#!/usr/bin/env fish

# Environment configuration: manage PATH based on .dir rules.
# Supports explicit directories, direct subdirectories (*), 
# and recursive subdirectories (**).
# Generates a .path file to track currently managed paths.

set base_dir (dirname (status -f))
set dir_file "$base_dir/.dir"
set path_file "$base_dir/.path"

function kit --description 'Manage astor-kit PATH'

    set cmd $argv[1]

    if test -z "$cmd"
        set cmd update
    end

    # Command: query
    if test "$cmd" = query
        if test -f $path_file
            cat $path_file
        else
            echo "No .path file found. Run 'kit update' first."
        end
        return

    end

    # Command: path
    if test "$cmd" = path
        string split : $PATH
        return
    end


    # For both clear and update, strip base_dir from PATH
    set -l new_path
    set -l path_parts (string split : $PATH)

    for part in $path_parts
        if not string match -q "$base_dir/*" $part
            set new_path $new_path $part
        end
    end

    # Command: clear
    if test "$cmd" = clear
        set -gx PATH $new_path
        rm -f $path_file

        echo "Cleared managed paths from PATH."
        return
    end

    # Command: update
    if test "$cmd" = update
        set -l subdirs
        if test -f $dir_file
            while read -l line
                # Remove comments and trim whitespace

                set line (string trim (string replace -r '#.*' '' $line))
                if test -z "$line"
                    continue
                end


                set target "$base_dir/$line"

                # Recursive subdirectories: ends with /**
                if string match -q '*\*\*' $line
                    set base_target (string replace -r '/\*\*$' '' $line)
                    set search_dir "$base_dir/$base_target"
                    if test -d $search_dir
                        # Fish's **/ matches directories recursively, including the base directory
                        for d in $search_dir/**/
                            set d_clean (string trim -r -c '/' $d)
                            if test -d $d_clean
                                set subdirs $subdirs $d_clean
                            end
                        end
                    end

                # Direct subdirectories: ends with /*
                else if string match -q '*/\*' $line
                    set base_target (string replace -r '/\*$' '' $line)
                    set search_dir "$base_dir/$base_target"
                    if test -d $search_dir

                        for d in $search_dir/*/
                            set d_clean (string trim -r -c '/' $d)
                            if test -d $d_clean
                                set subdirs $subdirs $d_clean
                            end
                        end
                    end

                # Explicit directory
                else
                    if test -d $target
                        set subdirs $subdirs $target
                    end
                end
            end < $dir_file
        end

        # Sort and remove duplicates

        if count $subdirs > /dev/null
            set subdirs (printf "%s\n" $subdirs | sort -u)
        end

        # Write to .path file
        if count $subdirs > /dev/null
            printf "%s\n" $subdirs > $path_file
        else
            rm -f $path_file
        end

        # Prepend subdirectories in reverse order
        set -l cnt (count $subdirs)
        if test $cnt -gt 0
            for i in (seq $cnt -1 1)
                set new_path $subdirs[$i] $new_path
            end
        end

        set -gx PATH $new_path
        echo "Path updated. Managed directories added to PATH."
        return
    end

    echo "Usage: kit [update|clear|query|path]"
end


# Automatically update on source

kit update > /dev/null

