# Environment configuration: manage PATH based on .dir rules.

# Supports explicit directories, direct subdirectories (*), 
# and recursive subdirectories (**).

# Generates a .path file to track currently managed paths.

local base_dir="${0:A:h}"
local dir_file="$base_dir/.dir"
local path_file="$base_dir/.path"

function kit() {

    local cmd="${1:-update}"


    # Command: query
    # Shows the paths currently managed in .path
    if [[ "$cmd" == "query" ]]; then
        if [[ -f "$path_file" ]]; then

            cat "$path_file"
        else
            echo "No .path file found. Run 'kit update' first."

        fi
        return
    fi

    # Command: path
    # Shows the entire current PATH
    if [[ "$cmd" == "path" ]]; then
        echo "$PATH" | tr ':' '\n'

        return
    fi

    # For both clear and update, we need to strip base_dir from PATH
    local -a new_path
    local -a path_parts
    path_parts=("${(@s/:/)PATH}")

    for part in "${path_parts[@]}"; do
        if [[ "$part" == "$base_dir"/* ]]; then

            continue
        fi
        new_path+=("$part")
    done

    # Command: clear
    # Removes managed paths from PATH and deletes .path file
    if [[ "$cmd" == "clear" ]]; then
        export PATH="${(j/:/)new_path}"
        rm -f "$path_file"
        echo "Cleared managed paths from PATH."
        return
    fi


    # Command: update
    if [[ "$cmd" == "update" ]]; then

        local -a subdirs

        if [[ -f "$dir_file" ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do

                # Remove comments and trim whitespace
                line="${line%%#*}"

                line="${line// /}"
                [[ -z "$line" ]] && continue

                local target="$base_dir/$line"

                if [[ "$line" == *"/**" ]]; then
                    # Recursive subdirectories

                    local base_target="${line%/\*\*}"
                    local search_dir="$base_dir/$base_target"

                    if [[ -d "$search_dir" ]]; then
                        while IFS= read -r d; do
                            subdirs+=("$d")
                        done < <(find "$search_dir" -mindepth 0 -type d)
                    fi

                elif [[ "$line" == *"/\*" ]]; then
                    # Direct subdirectories only
                    local base_target="${line%/\*}"
                    local search_dir="$base_dir/$base_target"
                    if [[ -d "$search_dir" ]]; then

                        for d in "$search_dir"/*(/N); do
                            subdirs+=("$d")
                        done
                    fi
                else
                    # Explicit directory
                    if [[ -d "$target" ]]; then

                        subdirs+=("$target")
                    fi
                fi
            done < "$dir_file"
        fi

        # Sort and remove duplicates
        subdirs=("${(@ou)subdirs}")

        # Write to .path file
        if [[ ${#subdirs[@]} -gt 0 ]]; then
            printf "%s\n" "${subdirs[@]}" > "$path_file"
        else
            rm -f "$path_file"
        fi

        # Prepend each subdirectory in reverse order

        for (( i = ${#subdirs[@]} ; i >= 1 ; i-- )); do
            new_path=("${subdirs[$i]}" "${new_path[@]}")
        done

        export PATH="${(j/:/)new_path}"

        echo "Path updated. Managed directories added to PATH."
        return
    fi

    echo "Usage: kit [update|clear|query|path]"
}


# Automatically update on source
kit update > /dev/null

